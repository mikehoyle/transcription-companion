name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The committed nginx.conf and public/_headers are generated from
      # config/csp.mjs; fail rather than silently serve a stale policy.
      - run: npm run headers -- --check
      - run: npm test
      # Runs the whole pipeline: copies & splits the ffmpeg core, type-checks,
      # builds (including the welcome-screen prerender) and checks every output
      # file against Cloudflare Pages' size limits.
      - run: npm run build
